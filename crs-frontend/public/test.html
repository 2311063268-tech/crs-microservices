<!DOCTYPE html>
<html>
<head>
    <title>Test CRS API</title>
</head>
<body>
    <h1>Kiểm tra kết nối CRS Gateway (Không dùng Vite)</h1>
    <div id="result">Đang tải dữ liệu...</div>

    <script>
        fetch('http://172.24.100.209:8080/api/courses')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Lỗi kết nối');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('result').innerHTML = 
                    '<pre style="color: green;">' + JSON.stringify(data, null, 2) + '</pre>';
            })
            .catch(error => {
                document.getElementById('result').innerHTML = 
                    '<pre style="color: red;">Lỗi: ' + error.message + '</pre>';
            });
    </script>
</body>
</html>
